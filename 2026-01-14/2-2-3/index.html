<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2-2-3</title>
  </head>
  <body>
    <script>
      function rollDice() {
        return Math.floor(Math.random() * 6) + 1;
      }

      function getScore(a, b) {
        return Math.abs(a - b);
      }

      const d1 = rollDice();
      const d2 = rollDice();
      console.log("DICE 1:", d1, "DICE 2:", d2);
      console.log("SCORE:", getScore(d1, d2));
    </script>
  </body>
</html>
