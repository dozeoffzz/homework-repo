<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4-1-3</title>
  </head>
  <body>
    <script>
      async function getStatus201() {
        try {
          const response = await fetch("https://tools-httpstatus.pickup-services.com/201");
          if (response.status === 201) {
            console.log("201 created 새 리소스 생성 성공!");
          }
        } catch (err) {
          console.error("error");
        }
      }
      console.log(getStatus201());

      async function getStatus404() {
        try {
          const response = await fetch("https://tools-httpstatus.pickup-services.com/404");
          if (response.status === 404) {
            console.log("404 Not Found 리소스 없음");
          }
        } catch (err) {
          console.error("error");
        }
      }
      console.log(getStatus404());

      // 400번대 에러는 클라이언트 에러이다.
      // 요청이 잘못 되었거나(400), 인증이 필요한 경우(401),권한이 없는 경우(403), 리소스가 없는 경우(404)가 있다.
      // 요청을 수정해서 다시 시도하고, 인증을 확인해야 한다(코드 확인)

      async function getStatus500() {
        try {
          const response = await fetch("https://tools-httpstatus.pickup-services.com/500");
          if (response.status === 500) {
            console.log("500 Internal Server Error 서버 내부 에러");
          }
        } catch (err) {
          console.err("error");
        }
      }
      console.log(getStatus500());

      // 500 번대 에러는 서버 에러이다.
      // 서버 내부에 문제가 생기거나(500), 게이트웨이 에러(502), 서비스 불가(503), 게이트웨이 타임아웃(504)등이 있다.
      // 502 - 중간 서버가 응답 받지 못하는 경우
      // 503 - 서버가 일시적으로 사용 불가한 경우
      // 504 - 서버가 응답 시간을 초과한 경우
      // 백엔드 개발자에게 말하자!
    </script>
  </body>
</html>
