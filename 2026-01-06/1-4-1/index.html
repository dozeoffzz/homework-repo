<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1-4-1</title>
  </head>
  <body>
    <script>
      const users = [
        {
          name: "Kim",
          profile: { bio: "Hi" },
        },
        {
          name: "Lee",
          profile: null,
        },
      ];

      for (const user of users) {
        const klUser = user?.profile?.bio ?? `소개 없음`;

        console.log(`<div>${user.name}: ${klUser}</div>`);
      }
    </script>
  </body>
</html>
