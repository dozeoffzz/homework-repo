<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1-3-3</title>
    <style>
      .button-group {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .button- {
        width: 200px;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div class="button-group">
      <button class="button-" data-action="add">추가</button>
      <button class="button-" data-action="edit">수정</button>
      <button class="button-" data-action="delete">삭제</button>
    </div>
    <script>
      const button = document.querySelector(".button-group");
      button.addEventListener("click", function (e) {
        const Btn = e.target.closest("button");
        if (!Btn || !button.contains(Btn)) return;

        if (e.target.dataset.action === "add") {
          console.log("Add Clicked");
          return;
        } else if (e.target.dataset.action === "edit") {
          console.log("Edit Clicked");
          return;
        } else e.target.dataset.action === "delete";
        console.log("Delete Clicked");
      });
    </script>
  </body>
</html>
