<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2-2-1</title>
  </head>
  <body>
    <script>
      const arr = [5, 12, 8, 130, 44, 3];
      const arr2 = arr
        .filter((item) => item >= 10)
        .map((item) => item * 2)
        .sort((a, b) => a - b);

      console.log(arr2);
    </script>
  </body>
</html>
