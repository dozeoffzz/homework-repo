<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2-1-1</title>
  </head>
  <body>
    <script>
      function sum(n) {
        let total = 0;
        for (i = 1; i <= n; i++) {
          total += i;
        }
        return total;
      }
      const answer = sum(10);
      console.log(answer);

      function sumEven(n) {
        let total = 0;
        for (i = 1; i <= n; i++)
          if (i % 2 === 0) {
            total += i;
          }
        return total;
      }
      const even = sumEven(10);
      console.log(even);

      function sumOdd(n) {
        let total = 0;
        for (i = 1; i <= n; i++)
          if (i % 2 === 1) {
            total += i;
          }
        return total;
      }
      const odd = sumOdd(10);
      console.log(odd);
    </script>
  </body>
</html>
