<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1-3-2</title>
    <style>
      body {
        height: 100%;
      }
      .profile-card {
        margin-top: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .dark-mode {
        background-color: #1a1a1a;
        color: #fff;
      }
      .button {
        margin: 10px;
      }
      .new {
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <section class="profile-card" data-user-id="dozeoffzz">
      <span class="profile-name">최원희</span>
      <button class="button">이름변경</button>
    </section>
    <script type="module">
      const darkBody = document.querySelector("body");
      const darkCard = document.querySelector(".profile-card");
      const darkName = document.querySelector(".profile-name");
      const changBtn = document.querySelector(".button");

      changBtn.addEventListener("click", function () {
        darkCard.textContent = "홍길동";
        darkCard.classList.toggle("dark-mode");
        darkBody.classList.toggle("dark-mode");

        const userId = darkCard.dataset.userId;
        console.log("user-id:", userId);

        const newStyle = document.createElement("span");
        newStyle.textContent = "💤";
        newStyle.classList.add("new");

        darkCard.appendChild(newStyle);
      });
    </script>
  </body>
</html>
